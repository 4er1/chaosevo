---
- name: Helm repository - prometheus-community
  kubernetes.core.helm_repository:
    name: prometheus-community
    repo_url: https://prometheus-community.github.io/helm-charts
  when: chaosevo_install_monitoring

- name: kube-prometheus-stack (Prometheus, Grafana, kube-state-metrics)
  kubernetes.core.helm:
    name: kube-prometheus-stack
    chart_ref: prometheus-community/kube-prometheus-stack
    release_namespace: "{{ chaosevo_monitoring_namespace }}"
    create_namespace: true
    wait: true
    values:
      grafana:
        adminPassword: "{{ chaosevo_grafana_admin_password }}"
        sidecar:
          dashboards:
            enabled: true
            label: grafana_dashboard
            searchNamespace: ALL
      prometheus:
        prometheusSpec:
          serviceMonitorSelectorNilUsesHelmValues: false
          scrapeInterval: 5s
  when: chaosevo_install_monitoring
  no_log: true          # the values contain the Grafana admin password

- name: Helm repository - Chaos Mesh
  kubernetes.core.helm_repository:
    name: chaos-mesh
    repo_url: https://charts.chaos-mesh.org
  when: chaosevo_install_chaos_mesh

- name: Chaos Mesh
  kubernetes.core.helm:
    name: chaos-mesh
    chart_ref: chaos-mesh/chaos-mesh
    release_namespace: chaos-mesh
    create_namespace: true
    wait: true
    values:
      chaosDaemon:
        runtime: "{{ chaosevo_chaos_mesh_runtime }}"
        socketPath: "{{ chaosevo_chaos_mesh_socket }}"
  when: chaosevo_install_chaos_mesh
